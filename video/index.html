<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>MLOps Fraud Detection - HyperFrames Video</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #07090e;
        --ink: #f1f5f9;
        --font-mono: 'JetBrains Mono', monospace;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
        font-family: var(--font-mono);
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="45"
      data-width="1920"
      data-height="1080"
    >
      <!-- Escena 1: El Hook de la Transacción Anómala (0s - 8s) -->
      <div
        id="scene1_hook"
        class="clip"
        data-composition-id="scene1_hook"
        data-composition-src="compositions/scene1_hook.html"
        data-start="0"
        data-duration="8"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Escena 2: Big Data & Dask Out-of-Core (8s - 17s) -->
      <div
        id="scene2_dask"
        class="clip"
        data-composition-id="scene2_dask"
        data-composition-src="compositions/scene2_dask.html"
        data-start="8"
        data-duration="9"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Escena 3: Invariante Financiera & Validación Pydantic (17s - 27s) -->
      <div
        id="scene3_api"
        class="clip"
        data-composition-id="scene3_api"
        data-composition-src="compositions/scene3_api.html"
        data-start="17"
        data-duration="10"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Escena 4: Payoff en Vivo del Dashboard (27s - 38s) -->
      <div
        id="scene4_payoff"
        class="clip"
        data-composition-id="scene4_payoff"
        data-composition-src="compositions/scene4_payoff.html"
        data-start="27"
        data-duration="11"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Escena 5: End Card & Autor (38s - 45s) -->
      <div
        id="scene5_endcard"
        class="clip"
        data-composition-id="scene5_endcard"
        data-composition-src="compositions/scene5_endcard.html"
        data-start="38"
        data-duration="7"
        data-track-index="1"
        data-width="1920"
        data-height="1080"
      ></div>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
